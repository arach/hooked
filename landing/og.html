<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    body {
      display: grid;
      place-items: center;
      color: #edf1f4;
      background:
        radial-gradient(circle at 68% 22%, rgba(75, 126, 221, .15), transparent 30%),
        radial-gradient(circle at 35% 75%, rgba(78, 207, 147, .08), transparent 34%),
        #07090c;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: 1020px; }
    header { display: flex; align-items: center; gap: 18px; margin-bottom: 68px; }
    img { width: 58px; height: 58px; }
    header span { font-size: 26px; font-weight: 700; letter-spacing: -.03em; }
    p { margin: 0; color: #7f8b96; font: 700 14px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .11em; text-transform: uppercase; }
    h1 { max-width: 880px; margin: 22px 0 30px; font-size: 78px; font-weight: 650; letter-spacing: -.065em; line-height: .98; }
    h1 span { color: #8fb2f6; }
    footer { display: flex; gap: 28px; color: #8e99a4; font-size: 18px; }
    footer i { color: #414a54; font-style: normal; }
  </style>
</head>
<body>
  <main>
    <header><img src="public/assets/hooked-mark.svg" alt=""><span>Hooked</span></header>
    <p>Local hooks toolkit</p>
    <h1>Local hooks.<br><span>Clear signals.</span></h1>
    <footer><span>Voice alerts</span><i>·</i><span>Until loops</span><i>·</i><span>Local dashboard</span><i>·</i><span>macOS HUD</span></footer>
  </main>
</body>
</html>
